<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Quarter Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#fff9f3;
      --card:#ffffff;
      --ink:#2d2520;
      --muted:#6f625a;
      --line:#eadfd6;
      --brand:#9b5c44;
      --brand2:#d6a15e;
      --soft:#fff1df;
      --green:#3d7a52;
      --red:#ad4a45;
      --shadow:0 8px 24px rgba(60,35,20,.08);
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:linear-gradient(180deg,var(--bg),#fff);
      color:var(--ink);
      padding-bottom:90px;
    }
    header{
      position:sticky; top:0; z-index:10;
      background:rgba(255,249,243,.96);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
      padding:18px 16px 12px;
    }
    h1{font-size:1.45rem;margin:0 0 4px;letter-spacing:-.02em}
    .sub{color:var(--muted);font-size:.93rem}
    .wrap{max-width:950px;margin:0 auto;padding:14px}
    .topgrid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:760px){.topgrid{grid-template-columns:1fr 1fr}}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .big-progress{display:flex;gap:14px;align-items:center}
    .ring{
      width:86px;height:86px;border-radius:50%;
      display:grid;place-items:center;font-weight:800;font-size:1.25rem;
      background:conic-gradient(var(--brand2) var(--deg), #f0e5da 0);
      position:relative; flex:0 0 auto;
    }
    .ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
    .ring span{position:relative;z-index:1}
    .barrow{margin:11px 0}
    .barlabel{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:5px;color:var(--muted)}
    .bar{height:12px;background:#f0e5da;border-radius:999px;overflow:hidden}
    .bar > div{height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:999px}
    .tabs{
      display:flex;gap:8px;overflow-x:auto;padding:8px 0 3px; -webkit-overflow-scrolling:touch;
    }
    .tab, button{
      border:0;
      background:#fff;
      color:var(--ink);
      border:1px solid var(--line);
      border-radius:999px;
      padding:11px 14px;
      font-weight:700;
      font-size:.95rem;
      min-height:44px;
      cursor:pointer;
      white-space:nowrap;
    }
    .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .controls{display:grid;gap:10px;margin:12px 0}
    @media(min-width:760px){.controls{grid-template-columns:1fr auto auto}}
    input, select, textarea{
      width:100%; border:1px solid var(--line); border-radius:16px;
      padding:12px 13px; font-size:16px; background:#fff; color:var(--ink);
    }
    textarea{min-height:80px;resize:vertical}
    .item{
      background:#fff;border:1px solid var(--line);border-radius:18px;
      padding:13px;margin:10px 0;box-shadow:0 3px 12px rgba(60,35,20,.05)
    }
    .item-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
    .title{font-weight:850;font-size:1.05rem}
    .meta{color:var(--muted);font-size:.92rem;margin-top:3px;line-height:1.35}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:.8rem;font-weight:800;background:var(--soft);color:#74432b;border:1px solid #f0d8bf}
    .badge.found{background:#eaf5ee;color:var(--green);border-color:#c8e3d0}
    .badge.verify{background:#fff5c9;color:#7a5b00;border-color:#edd986}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .primary{background:var(--green);color:white;border-color:var(--green)}
    .secondary{background:var(--soft)}
    .danger{background:#fff;color:var(--red);border-color:#e8c8c5}
    .tiny{font-size:.83rem;padding:8px 10px;min-height:38px}
    .form{display:grid;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
    .form.two{grid-template-columns:1fr 1fr}
    .hidden{display:none!important}
    .empty{padding:26px 16px;text-align:center;color:var(--muted)}
    .footer-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:20;
      background:rgba(255,255,255,.98);border-top:1px solid var(--line);
      display:flex;gap:8px;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    }
    .footer-nav button{flex:1;max-width:170px;padding:10px 8px;font-size:.85rem}
    .toast{
      position:fixed;left:14px;right:14px;bottom:86px;z-index:30;
      background:#2d2520;color:#fff;border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);
      display:none;
    }
    .toast.show{display:block}
    dialog{border:0;border-radius:24px;padding:0;width:min(92vw,560px);box-shadow:0 20px 80px rgba(0,0,0,.28)}
    dialog::backdrop{background:rgba(0,0,0,.35)}
    .modal{padding:18px}
    .modal h2{margin:0 0 10px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
    .offline{background:#fff5c9;border:1px solid #edd986;color:#674b00;border-radius:16px;padding:10px 12px;margin-top:10px}
    .logline{border-bottom:1px solid var(--line);padding:10px 0}
    .logline:last-child{border-bottom:0}
    .muted{color:var(--muted)}
    .small{font-size:.88rem}
  </style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>Family Quarter Tracker</h1>
    <div class="sub">Find a quarter, tap “Mark Found,” and everyone sees the update.</div>
  </div>
</header>

<main class="wrap">
  <div id="offline" class="offline hidden">Supabase is not reachable right now. You can still view the last loaded copy in this browser.</div>

  <section class="topgrid">
    <div class="card">
      <div class="big-progress">
        <div class="ring" id="overallRing" style="--deg:0deg"><span id="overallPct">0%</span></div>
        <div>
          <strong>Overall progress</strong>
          <div class="muted small"><span id="foundCount">0</span> found • <span id="neededCount">0</span> still needed</div>
          <div class="muted small" id="lastSync">Loading…</div>
        </div>
      </div>
    </div>
    <div class="card" id="progressByBook"></div>
  </section>

  <div class="tabs" id="tabs"></div>

  <section class="controls">
    <input id="search" placeholder="Search quarters…" />
    <select id="collectionFilter"><option value="all">All books</option></select>
    <select id="statusFilter">
      <option value="needed">Needed</option>
      <option value="found">Found</option>
      <option value="all">All</option>
      <option value="verify">Needs review</option>
    </select>
  </section>

  <section id="list"></section>

  <section id="activitySection" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">Recent updates</h2>
      <div id="activity"></div>
    </div>
  </section>
</main>

<nav class="footer-nav">
  <button onclick="openAddModal()">+ Add Quarter</button>
  <button onclick="exportBackup()">Export</button>
  <button onclick="document.getElementById('importFile').click()">Import</button>
  <input type="file" id="importFile" accept="application/json" class="hidden" />
</nav>

<div id="toast" class="toast"></div>

<dialog id="editDialog">
  <div class="modal">
    <h2 id="modalTitle">Quarter</h2>
    <div class="form">
      <input id="editCollection" placeholder="Book / collection" />
      <input id="editName" placeholder="Quarter name" />
      <div class="form two">
        <input id="editYear" placeholder="Year" type="number" />
        <input id="editMint" placeholder="Mint needed, like P or D" />
      </div>
      <div class="form two">
        <input id="editQty" placeholder="Quantity" type="number" min="1" />
        <select id="editStatus">
          <option value="needed">Needed</option>
          <option value="found">Found</option>
        </select>
      </div>
      <input id="editFoundBy" placeholder="Found by" />
      <input id="editDateFound" type="date" />
      <textarea id="editNotes" placeholder="Notes"></textarea>
      <label class="small"><input type="checkbox" id="editVerify" /> Needs review</label>
    </div>
    <div class="modal-actions">
      <button class="danger" id="deleteBtn">Delete</button>
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveModal()">Save</button>
    </div>
  </div>
</dialog>

<dialog id="foundDialog">
  <div class="modal">
    <h2>Who found it?</h2>
    <p class="muted" id="foundItemName"></p>
    <div class="form">
      <input id="foundByInput" placeholder="Name, like Mom, Kiffani, or Sister" />
      <input id="foundDateInput" type="date" />
      <textarea id="foundNotesInput" placeholder="Optional note"></textarea>
    </div>
    <div class="modal-actions">
      <button onclick="document.getElementById('foundDialog').close()">Cancel</button>
      <button class="primary" onclick="confirmFound()">Mark Found</button>
    </div>
  </div>
</dialog>

<script>
const SUPABASE_URL = "https://ydxytdkktakbyqypcbfz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xit3HrzLQcrRNYc1207sIQ_R_G-H7OQ";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let items = [];
let logs = [];
let activeTab = "Needed";
let editingId = null;
let foundTargetId = null;

const tabs = ["Needed","Found","Needs Review","Recent Updates"];
const collections = ["State Quarters","Map Book","Quarter Books","American Women","National Parks"];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
function cache(){ localStorage.setItem("quarter_items_cache", JSON.stringify(items)); localStorage.setItem("quarter_logs_cache", JSON.stringify(logs)); }
function loadCache(){ try{ items=JSON.parse(localStorage.getItem("quarter_items_cache")||"[]"); logs=JSON.parse(localStorage.getItem("quarter_logs_cache")||"[]"); }catch(e){} }

async function loadData(){
  document.getElementById("offline").classList.add("hidden");
  try{
    const {data, error} = await supabase.from("quarter_items").select("*").order("collection").order("quarter_name");
    if(error) throw error;
    items = data || [];
    const {data: logData, error: logErr} = await supabase.from("activity_log").select("*").order("created_at",{ascending:false}).limit(30);
    if(logErr) throw logErr;
    logs = logData || [];
    cache();
    document.getElementById("lastSync").textContent = "Synced just now";
  }catch(err){
    loadCache();
    document.getElementById("offline").classList.remove("hidden");
    document.getElementById("lastSync").textContent = "Showing last saved copy";
    console.error(err);
  }
  render();
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML = tabs.map(t=>`<button class="tab ${activeTab===t?'active':''}" onclick="activeTab='${t}'; render();">${t}</button>`).join("");
}

function renderCollectionFilter(){
  const sel=document.getElementById("collectionFilter");
  const current=sel.value || "all";
  sel.innerHTML = `<option value="all">All books</option>` + collections.map(c=>`<option value="${c}">${c}</option>`).join("");
  sel.value = current;
}

function stats(){
  const total=items.length;
  const found=items.filter(x=>x.status==="found").length;
  const needed=items.filter(x=>x.status==="needed").length;
  const pct=total?Math.round(found/total*100):0;
  return {total,found,needed,pct};
}

function renderProgress(){
  const s=stats();
  document.getElementById("overallPct").textContent=s.pct+"%";
  document.getElementById("overallRing").style.setProperty("--deg", (s.pct*3.6)+"deg");
  document.getElementById("foundCount").textContent=s.found;
  document.getElementById("neededCount").textContent=s.needed;

  const by = collections.map(c=>{
    const group=items.filter(x=>x.collection===c);
    const found=group.filter(x=>x.status==="found").length;
    const pct=group.length?Math.round(found/group.length*100):0;
    return `<div class="barrow">
      <div class="barlabel"><span>${c}</span><span>${found}/${group.length}</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
    </div>`;
  }).join("");
  document.getElementById("progressByBook").innerHTML = `<strong>Progress by book</strong>${by}`;
}

function filteredItems(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const col=document.getElementById("collectionFilter").value;
  let status=document.getElementById("statusFilter").value;

  if(activeTab==="Needed") status="needed";
  if(activeTab==="Found") status="found";
  if(activeTab==="Needs Review") status="verify";

  return items.filter(x=>{
    const matchQ=!q || [x.quarter_name,x.collection,x.year,x.mint_needed,x.notes,x.found_by].filter(Boolean).join(" ").toLowerCase().includes(q);
    const matchCol= col==="all" || x.collection===col;
    const matchStatus= status==="all" || (status==="verify" ? x.verify_flag : x.status===status);
    return matchQ && matchCol && matchStatus;
  });
}

function itemCard(x){
  const isFound=x.status==="found";
  const parts=[];
  if(x.year) parts.push(x.year);
  if(x.mint_needed) parts.push(`Mint: ${x.mint_needed}`);
  if(x.quantity_needed && x.quantity_needed>1) parts.push(`Qty: ${x.quantity_needed}`);
  if(x.found_by) parts.push(`Found by ${escapeHtml(x.found_by)}`);
  if(x.date_found) parts.push(x.date_found);
  if(x.notes) parts.push(escapeHtml(x.notes));
  return `<div class="item">
    <div class="item-head">
      <div>
        <div class="title">${escapeHtml(x.quarter_name)}</div>
        <div class="meta">${escapeHtml(x.collection)}${parts.length ? " • " + parts.join(" • ") : ""}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <span class="badge ${isFound?'found':''}">${isFound?'Found':'Needed'}</span>
        ${x.verify_flag?'<span class="badge verify">Review</span>':''}
      </div>
    </div>
    <div class="actions">
      ${isFound ? `<button class="secondary" onclick="markNeeded('${x.id}')">Move to Needed</button>` : `<button class="primary" onclick="openFound('${x.id}')">Mark Found</button>`}
      <button class="secondary" onclick="openEdit('${x.id}')">Edit</button>
    </div>
  </div>`;
}

function renderList(){
  const activity = activeTab === "Recent Updates";
  document.getElementById("activitySection").classList.toggle("hidden", !activity);
  document.getElementById("list").classList.toggle("hidden", activity);
  if(activity){ renderActivity(); return; }

  const arr=filteredItems();
  document.getElementById("list").innerHTML = arr.length ? arr.map(itemCard).join("") : `<div class="card empty">Nothing here right now. Try another tab or search.</div>`;
}

function renderActivity(){
  const el=document.getElementById("activity");
  if(!logs.length){ el.innerHTML=`<div class="empty">No updates yet.</div>`; return; }
  el.innerHTML=logs.map(l=>`<div class="logline">
    <strong>${escapeHtml(l.action)}</strong>
    <div class="muted small">${escapeHtml(l.quarter_name || "")} ${l.collection ? "• "+escapeHtml(l.collection) : ""}</div>
    <div>${escapeHtml(l.details || "")}</div>
    <div class="muted small">${new Date(l.created_at).toLocaleString()}</div>
  </div>`).join("");
}

function render(){
  renderTabs();
  renderCollectionFilter();
  renderProgress();
  renderList();
  document.getElementById("statusFilter").value = activeTab==="Found" ? "found" : activeTab==="Needed" ? "needed" : activeTab==="Needs Review" ? "verify" : document.getElementById("statusFilter").value;
}

function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m])); }

async function addLog(action, item, details){
  try{
    await supabase.from("activity_log").insert({
      item_id:item?.id || null,
      action, quarter_name:item?.quarter_name || null, collection:item?.collection || null,
      found_by:item?.found_by || null, details
    });
  }catch(e){ console.error(e); }
}

function openFound(id){
  foundTargetId=id;
  const item=items.find(x=>x.id===id);
  document.getElementById("foundItemName").textContent = item ? `${item.quarter_name} • ${item.collection}` : "";
  document.getElementById("foundByInput").value="";
  document.getElementById("foundDateInput").value=todayISO();
  document.getElementById("foundNotesInput").value="";
  document.getElementById("foundDialog").showModal();
}

async function confirmFound(){
  const item=items.find(x=>x.id===foundTargetId);
  if(!item) return;
  const updates = {
    status:"found",
    found_by:document.getElementById("foundByInput").value.trim() || "Family",
    date_found:document.getElementById("foundDateInput").value || todayISO(),
    notes:document.getElementById("foundNotesInput").value.trim() || item.notes
  };
  const {error}=await supabase.from("quarter_items").update(updates).eq("id", item.id);
  if(error){ showToast("Could not save. Try again."); return; }
  await addLog("Found", {...item,...updates}, `${updates.found_by} found ${item.quarter_name}.`);
  document.getElementById("foundDialog").close();
  showToast("Marked found!");
  await loadData();
}

async function markNeeded(id){
  const item=items.find(x=>x.id===id);
  if(!item) return;
  const {error}=await supabase.from("quarter_items").update({status:"needed", found_by:null, date_found:null}).eq("id", id);
  if(error){ showToast("Could not save. Try again."); return; }
  await addLog("Moved to Needed", item, `${item.quarter_name} was moved back to Needed.`);
  showToast("Moved back to needed.");
  await loadData();
}

function openEdit(id){
  const x=items.find(i=>i.id===id);
  editingId=id;
  document.getElementById("modalTitle").textContent="Edit quarter";
  document.getElementById("editCollection").value=x.collection||"";
  document.getElementById("editName").value=x.quarter_name||"";
  document.getElementById("editYear").value=x.year||"";
  document.getElementById("editMint").value=x.mint_needed||"";
  document.getElementById("editQty").value=x.quantity_needed||1;
  document.getElementById("editStatus").value=x.status||"needed";
  document.getElementById("editFoundBy").value=x.found_by||"";
  document.getElementById("editDateFound").value=x.date_found||"";
  document.getElementById("editNotes").value=x.notes||"";
  document.getElementById("editVerify").checked=!!x.verify_flag;
  document.getElementById("deleteBtn").classList.remove("hidden");
  document.getElementById("deleteBtn").onclick=()=>deleteItem(id);
  document.getElementById("editDialog").showModal();
}

function openAddModal(){
  editingId=null;
  document.getElementById("modalTitle").textContent="Add quarter";
  ["editCollection","editName","editYear","editMint","editFoundBy","editDateFound","editNotes"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("editQty").value=1;
  document.getElementById("editStatus").value="needed";
  document.getElementById("editVerify").checked=false;
  document.getElementById("deleteBtn").classList.add("hidden");
  document.getElementById("editDialog").showModal();
}
function closeModal(){ document.getElementById("editDialog").close(); }

async function saveModal(){
  const payload={
    collection:document.getElementById("editCollection").value.trim() || "Unsorted",
    quarter_name:document.getElementById("editName").value.trim(),
    year:document.getElementById("editYear").value ? Number(document.getElementById("editYear").value) : null,
    mint_needed:document.getElementById("editMint").value.trim() || null,
    quantity_needed:Number(document.getElementById("editQty").value || 1),
    status:document.getElementById("editStatus").value,
    found_by:document.getElementById("editFoundBy").value.trim() || null,
    date_found:document.getElementById("editDateFound").value || null,
    notes:document.getElementById("editNotes").value.trim() || null,
    verify_flag:document.getElementById("editVerify").checked
  };
  if(!payload.quarter_name){ showToast("Add a quarter name first."); return; }
  let error;
  if(editingId){
    ({error}=await supabase.from("quarter_items").update(payload).eq("id", editingId));
    await addLog("Edited", {id:editingId,...payload}, `${payload.quarter_name} was edited.`);
  }else{
    const res=await supabase.from("quarter_items").insert(payload).select().single();
    error=res.error;
    if(!error) await addLog("Added", res.data, `${payload.quarter_name} was added.`);
  }
  if(error){ showToast("Could not save. Try again."); console.error(error); return; }
  closeModal(); showToast("Saved."); await loadData();
}

async function deleteItem(id){
  if(!confirm("Delete this quarter from the tracker?")) return;
  const item=items.find(x=>x.id===id);
  const {error}=await supabase.from("quarter_items").delete().eq("id", id);
  if(error){ showToast("Could not delete."); return; }
  await addLog("Deleted", item, `${item?.quarter_name || "An item"} was deleted.`);
  closeModal(); showToast("Deleted."); await loadData();
}

function exportBackup(){
  const payload={exported_at:new Date().toISOString(), quarter_items:items, activity_log:logs};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`family-quarter-tracker-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("importFile").addEventListener("change", async (e)=>{
  const file=e.target.files[0]; if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    const imported=data.quarter_items || [];
    if(!Array.isArray(imported)) throw new Error("Bad file");
    if(!confirm(`Import ${imported.length} quarter items? This will add them as new rows.`)) return;
    const cleaned=imported.map(({id,created_at,updated_at,...rest})=>rest);
    const {error}=await supabase.from("quarter_items").insert(cleaned);
    if(error) throw error;
    await addLog("Imported", null, `${cleaned.length} items were imported from backup.`);
    showToast("Import complete.");
    await loadData();
  }catch(err){ console.error(err); showToast("Import did not work. Check the file."); }
  e.target.value="";
});

["search","collectionFilter","statusFilter"].forEach(id=>document.getElementById(id).addEventListener("input", renderList));

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
